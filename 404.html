<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - TruePhone BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { trust: '#0F766E', dark: '#1F2937', surface: '#F9FAFB' }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-dark font-sans h-screen flex flex-col">

    <!-- Simple Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-[1440px] mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer">
                <div class="bg-trust text-white p-2 rounded-lg flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-mobile-screen-button text-lg"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight text-dark mt-1">TruePhone<span class="text-trust">BD</span></span>
            </div>
            
            <a href="#" class="bg-gray-100 hover:bg-gray-200 text-dark px-5 py-2.5 rounded-lg shadow-sm transition-all font-semibold text-sm">
                Help Center
            </a>
        </div>
    </header>

    <!-- 404 Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
        
        <div class="relative w-48 h-48 mb-8 flex justify-center items-center">
            <!-- Background glow -->
            <div class="absolute inset-0 bg-teal-100 rounded-full blur-3xl opacity-50"></div>
            
            <!-- Broken Phone / Search Icon -->
            <div class="relative z-10 w-32 h-32 bg-white rounded-full border-4 border-gray-100 shadow-xl flex items-center justify-center text-6xl text-gray-300">
                <i class="fa-solid fa-magnifying-glass-minus text-trust"></i>
            </div>
            
            <!-- Floating Elements -->
            <div class="absolute top-0 right-0 bg-red-100 text-red-500 w-10 h-10 rounded-full flex items-center justify-center text-xl font-bold border-2 border-white shadow-sm transform rotate-12">
                4
            </div>
            <div class="absolute bottom-4 left-0 bg-yellow-100 text-yellow-500 w-12 h-12 rounded-full flex items-center justify-center text-2xl font-bold border-2 border-white shadow-sm transform -rotate-12">
                0
            </div>
            <div class="absolute top-1/2 -right-6 bg-blue-100 text-blue-500 w-10 h-10 rounded-full flex items-center justify-center text-xl font-bold border-2 border-white shadow-sm transform rotate-6">
                4
            </div>
        </div>

        <h1 class="text-4xl md:text-5xl font-extrabold text-dark tracking-tight mb-4">Page Not Found</h1>
        <p class="text-gray-500 text-lg max-w-md mx-auto mb-10 leading-relaxed">
            Oops! The page or phone listing you are looking for might have been sold, removed, or is temporarily unavailable.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
            <button class="bg-trust hover:bg-trustHover text-white px-8 py-3.5 rounded-xl font-bold text-lg shadow-md transition transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
                <i class="fa-solid fa-home"></i> Go to Homepage
            </button>
            <button class="bg-white border border-gray-200 hover:border-trust text-dark px-8 py-3.5 rounded-xl font-bold text-lg shadow-sm transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-mobile-screen"></i> Browse Phones
            </button>
        </div>

    </main>

    <!-- Minimal Footer -->
    <footer class="py-6 text-center text-sm text-gray-400 bg-white border-t border-gray-200">
        <p>© 2026 TruePhone BD. All rights reserved.</p>
    </footer>

</body>
</html>
